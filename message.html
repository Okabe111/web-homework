<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星尘个人展示站 - 留言板</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>星</text></svg>">
</head>
<body>
    <header>
        <div class="logo">星尘展示站</div>
        <nav class="nav">
            <a href="index.html">首页</a>
            <a href="message.html" class="active">留言板</a>
        </nav>
    </header>

    <section class="page-head">
        <h1>在线留言板</h1>
        <p>欢迎留下你的建议与想法，表单已预留后端提交接口</p>
    </section>

    <main class="container">
        <div class="msg-layout">
            <section class="panel">
                <h2>发表留言</h2>
                <form class="msg-form" id="msgForm">
                    <label>昵称<span class="req">*</span></label>
                    <input type="text" id="username" maxlength="20" placeholder="请输入昵称">

                    <label>留言内容<span class="req">*</span></label>
                    <textarea id="msgContent" maxlength="300" placeholder="请写下你的留言（300字以内）"></textarea>

                    <button type="button" id="submitBtn">提交留言</button>
                </form>
            </section>

            <section class="panel">
                <h2>留言列表</h2>
                <ul class="msg-list" id="msgList"></ul>
            </section>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer>
        课程前端作业 | 学号：1-03 | 化名：沈星
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
